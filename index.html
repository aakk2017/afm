<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFM decoder</title>
    <link rel="stylesheet" href="afm.css">
</head>
<body>
    <div class="container">
        <div class="left-column">
            <div class="input-area">
                <div class="input-container">
                    <input 
                    type="file" 
                    id="open-file" 
                    name="open-file" 
                    onchange="viewFile()" />
                </div>
            </div>
            <div class="image-area">
                <div class="image-panel">
                    <div class="tab-area">
                        <div class="tab" id="height-tab" on-view>Height</div>
                        <div class="tab" id="error-tab">Amplitude Error</div>
                        <div class="tab" id="phase-tab">Phase</div>
                    </div>
                    <div class="image-container">
                        <canvas class="afm-image" id="afm-image"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="right-column">
            <div class="info-area"></div>
            <div class="toolbar"></div>
            <div class="text-area-container">
                <textarea name="data" id="data"></textarea>
            </div>
        </div>
    </div>
    <script src="afm.js"></script>
</body>
</html>
